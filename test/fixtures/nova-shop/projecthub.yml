project:
  name: Nova Mağaza
  slug: nova-magaza
  version: 1.2.0
runtime:
  type: node
  version: "22"
install:
  command: npm ci
build:
  command: npm run build
test:
  command: npm test
start:
  command: npm start
  port: 3000
health:
  path: /api/health
database:
  type: postgresql
  migrate:
    directory: db/migrations
preview:
  enabled: true
  ttl: 24h
  mode: process
deploy:
  source: dist
smoke:
  paths:
    - /
    - /api/health
env:
  - name: DATABASE_URL
    required: false
    description: Sipariş veritabanı
security:
  dependencyScan: true
  secretScan: true
ai:
  indexing: true
  autonomy: L2
