<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Hub 2.0 — Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEE9; --panel:#FFFFFF; --sunk:#E3E6E0; --sunk2:#F5F6F3; --ink:#17212B; --muted:#5B6772; --faint:#8A939B; --line:#D2D7CF;
  --primary:#234E8C; --primary-soft:#DDE6F3; --on-primary:#fff;
  --amber:#C27F0E; --amber-soft:#F6E7C8;
  --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#A86B12; --warn-soft:#F6EBD3; --bad:#BE3B28; --bad-soft:#F6DED9; --run:#2563A8; --run-soft:#DCE8F6; --idle:#7D868E; --idle-soft:#E6E8E8;
  --code-bg:#FBFBF8; --code-ln:#A3AAB0;
  --t-kw:#7A3EA8; --t-str:#2E7D4F; --t-num:#B5520F; --t-com:#8A939B; --t-fn:#234E8C; --t-tag:#BE3B28; --t-key:#2563A8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r1:4px; --r2:8px; --r3:14px;
  --shadow:0 1px 0 rgba(23,33,43,.06),0 8px 24px -12px rgba(23,33,43,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121920; --panel:#1A232C; --sunk:#0F151B; --sunk2:#161E26; --ink:#E2E7EB; --muted:#9AA6B1; --faint:#6E7A85; --line:#2B3640;
    --primary:#7EA5E6; --primary-soft:#22324A; --on-primary:#0F151B;
    --amber:#E5A93A; --amber-soft:#3A2F1A;
    --ok:#5DBB83; --ok-soft:#1C3328; --warn:#E0A84A; --warn-soft:#3A2F1A; --bad:#EE7A66; --bad-soft:#3C2320; --run:#6FA6E8; --run-soft:#1D2D42; --idle:#8A949D; --idle-soft:#252E36;
    --code-bg:#141B22; --code-ln:#55616B;
    --t-kw:#C49BEA; --t-str:#7FCB9B; --t-num:#F0A36B; --t-com:#6E7A85; --t-fn:#8FB4EE; --t-tag:#F08A78; --t-key:#79B2EE;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121920; --panel:#1A232C; --sunk:#0F151B; --sunk2:#161E26; --ink:#E2E7EB; --muted:#9AA6B1; --faint:#6E7A85; --line:#2B3640;
  --primary:#7EA5E6; --primary-soft:#22324A; --on-primary:#0F151B;
  --amber:#E5A93A; --amber-soft:#3A2F1A;
  --ok:#5DBB83; --ok-soft:#1C3328; --warn:#E0A84A; --warn-soft:#3A2F1A; --bad:#EE7A66; --bad-soft:#3C2320; --run:#6FA6E8; --run-soft:#1D2D42; --idle:#8A949D; --idle-soft:#252E36;
  --code-bg:#141B22; --code-ln:#55616B;
  --t-kw:#C49BEA; --t-str:#7FCB9B; --t-num:#F0A36B; --t-com:#6E7A85; --t-fn:#8FB4EE; --t-tag:#F08A78; --t-key:#79B2EE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
img,svg{max-width:100%}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:52px 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;min-width:208px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 13px var(--mono)}
.org{border:1px solid var(--line);background:var(--sunk2);border-radius:var(--r2);padding:4px 10px;font-size:13px;color:var(--muted)}
.search-btn{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk2);border-radius:var(--r2);padding:6px 10px;color:var(--muted);cursor:pointer;text-align:left}
.search-btn kbd{margin-left:auto}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel);color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;border:0;background:transparent;border-radius:var(--r2);padding:6px 8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{background:var(--sunk)}
.icon-btn .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px 20px}
.side h6{margin:16px 10px 6px;font-size:12px;font-weight:600;color:var(--faint)}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--r2);color:var(--ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--sunk2)}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
.nav svg{width:16px;height:16px;flex:none;opacity:.8}
.main{overflow:auto;min-width:0;position:relative}
.page{padding:22px 26px 60px;max-width:1440px}
.menu-btn{display:none}

/* ---------- type ---------- */
h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12px}
p{margin:0 0 10px}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r2);padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:16px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--idle-soft);color:var(--idle);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-run{background:var(--run-soft);color:var(--run)} .b-amber{background:var(--amber-soft);color:var(--amber)} .b-pri{background:var(--primary-soft);color:var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--panel);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font:11.5px var(--mono);background:var(--sunk);border-radius:4px;padding:1px 6px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk2)}
.tbl{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:3px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);padding:7px 10px;font-size:13.5px}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:2px solid var(--primary);outline-offset:-1px}
.in.err{border-color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.list-item{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.ai-note{border-left:3px solid var(--primary);background:var(--primary-soft);padding:10px 12px;border-radius:0 var(--r2) var(--r2) 0;font-size:13px}
.ai-note b{color:var(--primary)}
.warnbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 var(--r2) var(--r2) 0;font-size:13px}
.badbox{border-left:3px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:0 var(--r2) var(--r2) 0;font-size:13px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.spark{width:100%;height:46px;display:block}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- project header + lifecycle rail (signature) ---------- */
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.p-title{display:flex;align-items:center;gap:12px}
.p-logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.p-wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}
.p-nav{position:sticky;top:0}
.p-nav a{font-size:13px;padding:5px 10px}
.p-nav h6{margin:12px 10px 4px}
.rail{display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 2px;margin:0 0 18px;gap:0}
.rail .st{flex:1 0 auto;min-width:86px;position:relative;padding:22px 6px 0;text-align:center;font-size:11.5px;color:var(--muted);text-decoration:none;cursor:pointer}
.rail .st::before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line)}
.rail .st:first-child::before{left:50%} .rail .st:last-child::before{right:50%}
.rail .st i{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--line);z-index:1}
.rail .st.done::before{background:var(--amber)}
.rail .st.done i{background:var(--amber);border-color:var(--amber)}
.rail .st.now i{background:var(--panel);border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.rail .st.now{color:var(--ink);font-weight:600}
.rail .st:hover{color:var(--ink)}

/* ---------- timeline ---------- */
.tl{position:relative;margin-left:8px}
.tl-day{font-size:12px;font-weight:600;color:var(--muted);margin:18px 0 8px 30px}
.tl-ev{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;padding:8px 0 8px 0}
.tl-ev::before{content:"";position:absolute;left:61px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-ev .tm{font:12px var(--mono);color:var(--muted);text-align:right;padding-top:9px}
.tl-ev .bd{position:relative;margin-left:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px}
.tl-ev .bd::before{content:"";position:absolute;left:-23px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--kc,var(--idle))}
.tl-ev.hl .bd{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.tl-k{font-size:11.5px;font-weight:600;color:var(--kc,var(--muted))}

/* ---------- code editor ---------- */
.ide{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--panel);height:calc(100vh - 220px);min-height:520px}
.ide.with-ai{grid-template-columns:220px minmax(0,1fr) 290px}
.tree{border-right:1px solid var(--line);overflow:auto;padding:8px 4px;background:var(--sunk2);font-size:13px}
.tree .f{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.tree .f:hover{background:var(--sunk)}
.tree .f.on{background:var(--primary-soft);color:var(--primary)}
.tree .d{padding:3px 8px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tree .mod{margin-left:auto;color:var(--amber);font-weight:700}
.ed-col{display:flex;flex-direction:column;min-width:0}
.ed-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--sunk2)}
.ed-tab{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:12.5px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--muted)}
.ed-tab.on{background:var(--code-bg);color:var(--ink)}
.ed-tab .x{border:0;background:transparent;cursor:pointer;color:var(--faint);padding:0 2px}
.ed-tab .dm{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.ed-tool{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-body{position:relative;flex:1;overflow:auto;background:var(--code-bg)}
.ed-inner{position:relative;display:grid;grid-template-columns:48px 1fr;min-height:100%}
.ed-ln{font:13px/20px var(--mono);color:var(--code-ln);text-align:right;padding:10px 10px 10px 0;user-select:none;border-right:1px solid var(--line)}
.ed-ln div.cur{color:var(--ink)}
.ed-area{position:relative}
.ed-area pre,.ed-area textarea{margin:0;font:13px/20px var(--mono);padding:10px 14px;white-space:pre;tab-size:2;border:0;letter-spacing:0}
.ed-area pre{pointer-events:none;color:var(--ink);min-height:100%}
.ed-area textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--ink);outline:none;overflow:hidden}
.ed-area textarea::selection{background:color-mix(in srgb,var(--primary) 30%,transparent);color:transparent}
.ed-status{display:flex;gap:16px;padding:4px 12px;font:11.5px var(--mono);color:var(--muted);border-top:1px solid var(--line);background:var(--sunk2);flex-wrap:wrap}
.tk-kw{color:var(--t-kw)} .tk-str{color:var(--t-str)} .tk-num{color:var(--t-num)} .tk-com{color:var(--t-com);font-style:italic} .tk-fn{color:var(--t-fn)} .tk-tag{color:var(--t-tag)} .tk-key{color:var(--t-key)}
.diff{font:12.5px/19px var(--mono);overflow:auto;max-height:380px;border:1px solid var(--line);border-radius:var(--r2);background:var(--code-bg)}
.diff div{padding:0 10px;white-space:pre}
.diff .a{background:var(--ok-soft);color:var(--ok)} .diff .r{background:var(--bad-soft);color:var(--bad)} .diff .h{background:var(--sunk);color:var(--muted)}
.ai-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--panel)}

/* ---------- simulator ---------- */
.sim-stage{background:repeating-linear-gradient(45deg,var(--sunk2) 0 10px,var(--sunk) 10px 20px);border:1px solid var(--line);border-radius:var(--r3);min-height:560px;display:grid;place-items:center;padding:24px;overflow:auto;position:relative}
.device{background:#20262C;border-radius:34px;padding:12px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);position:relative;flex:none}
.device.tablet{border-radius:24px;padding:16px}
.device.desk{border-radius:10px;padding:10px 10px 26px;background:#2A3138}
.device .scr{background:#fff;border-radius:24px;overflow:hidden;position:relative}
.device.tablet .scr{border-radius:10px}
.device.desk .scr{border-radius:3px}
.device .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:26%;height:14px;background:#20262C;border-radius:0 0 14px 14px;z-index:2}
.frame-wrap{overflow:hidden;position:relative}
.frame-wrap iframe{border:0;transform-origin:0 0;display:block;background:#fff}
.dev-list{max-height:560px;overflow:auto}
.dev-list button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;text-align:left}
.dev-list button:hover{background:var(--sunk2)}
.dev-list button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}

/* ---------- pipeline ---------- */
.pipe{display:grid;gap:6px}
.pstep{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r2);background:var(--sunk2);font-size:13px}
.pstep .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.pstep.ok .ic{background:var(--ok);border-color:var(--ok)} .pstep.bad .ic{background:var(--bad);border-color:var(--bad)}
.pstep.run .ic{border-color:var(--run);border-top-color:transparent;animation:spin .8s linear infinite}
.pstep.skip{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
.pipe-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.pipe-h .n{padding:4px 10px;border-radius:999px;background:var(--sunk);}
.pipe-h .n.ok{background:var(--ok-soft);color:var(--ok)} .pipe-h .n.bad{background:var(--bad-soft);color:var(--bad)}
.pipe-h .ar{color:var(--faint)}

/* ---------- overlays ---------- */

<script type="text/plain" data-p="ecommerce" data-f="src/components/CheckoutButton.tsx">import { useState } from "react";
import { PaymentService } from "../services/PaymentService";

type Props = {
  cartId: string;
  total: number;
};

// Sepet sayfasındaki ödeme butonu
export function CheckoutButton({ cartId, total }: Props) {
  const [loading, setLoading] = useState(false);

  async function handleClick() {
    setLoading(true);
    try {
      await PaymentService.createSession(cartId, total);
    } finally {
      setLoading(false);
    }
  }

  return (
    <button className="checkout" onClick={handleClick} disabled={loading}>
      {loading ? "İşleniyor..." : "Ödemeye geç"}
    </button>
  );
}
</script>

<script type="text/plain" data-p="ecommerce" data-f="src/services/PaymentService.ts">import Stripe from "stripe";
import { prisma } from "../lib/db";

const stripe = new Stripe(process.env.STRIPE_SECRET as string);

export const PaymentService = {
  async createSession(cartId: string, total: number) {
    const cart = await prisma.cart.findUnique({ where: { id: cartId } });
    if (!cart) throw new Error("CART_NOT_FOUND");

    // TODO: timeout değeri 30 sn'den 10 sn'ye indirilecek (INC-184)
    return stripe.checkout.sessions.create({
      mode: "payment",
      line_items: [{ price_data: { currency: "try", unit_amount: total * 100, product_data: { name: "Sipariş" } }, quantity: 1 }],
      success_url: process.env.APP_URL + "/success",
      cancel_url: process.env.APP_URL + "/checkout",
    });
  },
};
</script>
<script type="text/plain" data-p="ecommerce" data-f="src/services/UserService.ts">import { prisma } from "../lib/db";
import type { UserDTO } from "../types/user";

export class UserService {
  async findById(id: string): Promise<UserDTO | null> {
    const user = await prisma.user.findUnique({ where: { id } });
    if (!user) return null;
    return {
      id: user.id,
      email: user.email,
      fullName: user.fullName,
      phone: user.phone,
    };
  }
}
</script>

}

model Cart {

  userId    String

  status    String   @default("open")
}

/* load raw files */
function loadFiles(){
  $$('script[type="text/plain"][data-p]').forEach(s=>{
    const p=s.dataset.p; if(S._loaded)return; S.files[p]=S.files[p]||{}; S.files[p][s.dataset.f]=s.textContent.replace(/^\n/,'');
  });
  // light file sets for other projects
  S.projects.forEach(p=>{
    if(S.files[p.id]) return;
    S.files[p.id]={
      'projecthub.yml':`project:\n  name: ${p.name}\n  slug: ${p.id}\n  version: ${p.version}\n\nruntime:\n  type: ${p.runtime}\n\npreview:\n  enabled: true\n  ttl: 24h\n\nsecurity:\n  dependencyScan: true\n  secretScan: true\n`,
      'README.md':`# ${p.name}\n\n${p.desc}\n\n## Teknolojiler\n\n${p.tech.map(t=>'- '+t).join('\n')}\n`,
      'src/styles/theme.css':`:root {\n  --brand: ${p.brand};\n  --accent: #f2b33d;\n  --radius: 8px;\n  --cta-height: 40px;\n  --logo-size: 20px;\n  --font: "Segoe UI", Roboto, sans-serif;\n}\n`,
      'src/main.ts':`// ${p.name} giriş noktası\nimport { bootstrap } from "./app";\n\nbootstrap({ port: 3000 });\n`
    };
  });
  for(const p in S.files){if(!S.saved[p])S.saved[p]={...S.files[p]};}
  S._loaded=true;
}

/* ---------- syntax highlight ---------- */
const KW=/\b(import|from|export|const|let|var|function|return|async|await|if|else|try|catch|finally|throw|new|class|type|interface|extends|implements|default|for|while|of|in|null|undefined|true|false|this|public|private|static|enum|model|datasource|provider|as)\b/;
const KWX=new RegExp('^'+KW.source+'$');
function langOf(f){if(/\.(tsx?|jsx?)$/.test(f))return'ts';if(/\.css$/.test(f))return'css';if(/\.ya?ml$/.test(f))return'yml';if(/\.json$/.test(f))return'json';if(/\.md$/.test(f))return'md';if(/\.prisma$/.test(f))return'ts';return'txt'}
function hl(src,lang){
  if(lang==='txt'||lang==='md'){
    if(lang==='md')return src.split('\n').map(l=>/^#/.test(l)?`<span class="tk-fn">${esc(l)}</span>`:/^\s*-\s/.test(l)?`<span class="tk-kw">${esc(l.slice(0,l.indexOf('-')+1))}</span>${esc(l.slice(l.indexOf('-')+1))}`:esc(l)).join('\n');
    return src.split('\n').map(l=>{const m=l.match(/^([A-Z_]+)=(.*)$/);return m?`<span class="tk-key">${esc(m[1])}</span>=<span class="tk-str">${esc(m[2])}</span>`:`<span class="tk-com">${esc(l)}</span>`}).join('\n');
  }
  if(lang==='yml'){
    return src.split('\n').map(l=>{if(/^\s*#/.test(l))return`<span class="tk-com">${esc(l)}</span>`;const m=l.match(/^(\s*)([\w.-]+)(:)(.*)$/);if(!m)return esc(l);let v=m[4];let vv=/^\s*(true|false)\s*$/.test(v)?`<span class="tk-kw">${esc(v)}</span>`:/^\s*[\d.]+\s*$/.test(v)?`<span class="tk-num">${esc(v)}</span>`:`<span class="tk-str">${esc(v)}</span>`;return m[1]+`<span class="tk-key">${esc(m[2])}</span>`+m[3]+vv}).join('\n');
  }
  const re=lang==='css'
    ?/(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(--[\w-]+)|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|rem|em|%|s)?\b)|([:;{}])/g
    :/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`]*`)|(<\/?[A-Za-z][\w.]*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(?=\s*\()|(\b[A-Za-z_$][\w$]*\b)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;
    const t=esc(m[0]);
    if(m[1])out+=`<span class="tk-com">${t}</span>`;
    else if(m[2])out+=`<span class="tk-str">${t}</span>`;
    else if(lang==='css'){ if(m[3])out+=`<span class="tk-key">${t}</span>`;else if(m[4])out+=`<span class="tk-num">${t}</span>`;else out+=t; }
    else if(m[3])out+=`<span class="tk-tag">${t}</span>`;
    else if(m[4])out+=`<span class="tk-num">${t}</span>`;
    else if(m[5])out+=KWX.test(m[0])?`<span class="tk-kw">${t}</span>`:`<span class="tk-fn">${t}</span>`;
    else if(m[6])out+=KWX.test(m[0])?`<span class="tk-kw">${t}</span>`:t;
    else out+=t;
  }
  return out+esc(src.slice(last));
}

/* ---------- line diff (LCS) ---------- */
function lineDiff(a,b){
  const A=a.split('\n'),B=b.split('\n'),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){out.push(['c',A[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push(['r',A[i++]])}else out.push(['a',B[j++]])}
  while(i<n)out.push(['r',A[i++]]);while(j<m)out.push(['a',B[j++]]);
  // collapse context
  const keep=out.map((d,k)=>d[0]!=='c'||out.slice(Math.max(0,k-2),k+3).some(x=>x[0]!=='c'));
  const res=[];let gap=false;out.forEach((d,k)=>{if(keep[k]){res.push(d);gap=false}else if(!gap){res.push(['h','⋯']);gap=true}});
  return res;
}
const diffHTML=d=>`<div class="diff">${d.map(([k,l])=>`<div class="${k==='c'?'':k}">${k==='a'?'+ ':k==='r'?'− ':k==='h'?'':'  '}${esc(l)}</div>`).join('')}</div>`;

/* ---------- tiny markdown ---------- */
function md(s){
  const lines=s.split('\n');let h='',inCode=false,inList=false,buf=[];
  const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  for(const l of lines){
    if(l.startsWith('```')){if(inCode){h+=`<pre><code>${esc(buf.join('\n'))}</code></pre>`;buf=[];inCode=false}else{if(inList){h+='</ul>';inList=false}inCode=true}continue}
    if(inCode){buf.push(l);continue}
    if(/^\s*-\s/.test(l)){if(!inList){h+='<ul>';inList=true}h+=`<li>${inline(l.replace(/^\s*-\s/,''))}</li>`;continue}
    if(inList){h+='</ul>';inList=false}
    if(/^### /.test(l))h+=`<h3>${inline(l.slice(4))}</h3>`;
    else if(/^## /.test(l))h+=`<h2>${inline(l.slice(3))}</h2>`;
    else if(/^# /.test(l))h+=`<h1>${inline(l.slice(2))}</h1>`;
    else if(l.trim())h+=`<p>${inline(l)}</p>`;
  }
  if(inList)h+='</ul>';
  return h;
}

  return {parts,q:new URLSearchParams((location.hash.split('?')[1])||'')};
}

      else body=`<div class="page"><div class="empty"><b>Sayfa bulunamadı</b>Adres yanlış olabilir. <a href="#/">Ana sayfaya dön</a></div></div>`;
    }catch(err){console.error(err);body=`<div class="page"><div class="badbox"><b>Bu ekran yüklenemedi.</b> ${esc(err.message)}</div></div>`}
    app.innerHTML=shellTop()+shellSide(parts)+`<main class="main" id="main">${body}</main>`;
  }
  const a=AFTER;AFTER=[];a.forEach(f=>f());
}

function stripRoot(list){ // list of [path,...]
  const first=list.map(x=>x[0].split('/')[0]);const same=first.length&&first.every(f=>f===first[0])&&list.every(x=>x[0].includes('/'));

async function ingest(entries,origin){ // entries: [path, size, getText()]

  for(const [path,size,get] of list){

    try{w.files[path]=await get();read++;bytes+=size}catch(e){skipped++}

function bindImportInputs(){

  });

/* ---------- command palette ---------- */
function commands(){
  const C=[];
  S.projects.forEach(p=>{C.push(['Projeler',`${p.name} aç`,`#/p/${p.id}`,'proje']);});
  const pid=curPid();
  [['Kod editörünü aç','code'],['Zaman akışı','timeline'],['Ön izleme oluştur','preview'],['Simülatör','simulator'],['Feedback listesi','feedback'],['Müşteri dokümanı','docs'],['Güvenlik taraması','security'],['Deployment','deploy'],['AI asistanı','ai'],['Gözlemlenebilirlik','observability']].forEach(([l,t])=>C.push(['Bu projede',`${l} · ${P(pid).name}`,`#/p/${pid}/${t}`,t]));
  [['Proje içe aktar (bilgisayar, ZIP, GitHub)','#/import'],['deploy crm staging','fn:deployCRM'],['scan payment-api','#/p/payment-api/security'],['create review ecommerce','fn:review'],['ask ai login architecture','fn:askLogin'],['invite user','#/admin/users'],['open archive 2024','#/archive']].forEach(([l,h])=>C.push(['Komutlar',l,h,'komut']));
  Object.keys(S.files.ecommerce).forEach(f=>C.push(['Dosyalar',f,'file:'+f,'dosya']));
  S.feedback.forEach(f=>C.push(['Feedback',`${f.id} ${f.title} — ${f.reporter.first} ${f.reporter.last} (${f.reporter.dept})`,`fb:${f.id}`,'feedback']));
  S.commits.ecommerce.forEach(c=>C.push(['Commit\'ler',`${c.sha} ${c.msg}`,'#/p/ecommerce/git','commit']));

}
function openPalette(){
  $('#overlay').innerHTML=`<div class="scrim" data-a="scrim"><div class="palette" role="dialog" aria-label="Komut paleti"><input id="palin" placeholder="Komut yazın veya arayın: deploy crm staging, stripe, Elif…" autocomplete="off"><div class="pal-list" id="pallist"></div><div class="small muted" style="padding:8px 14px;border-top:1px solid var(--line)">↑↓ gez · Enter aç · Esc kapat</div></div></div>`;
  const inp=$('#palin');let idx=0,res=[];
  const draw=()=>{const q=inp.value.toLowerCase().trim();res=commands().filter(c=>!q||c[1].toLowerCase().includes(q)||q.split(' ').every(w=>c[1].toLowerCase().includes(w))).slice(0,40);idx=Math.min(idx,res.length-1);let g='';
    $('#pallist').innerHTML=res.map((c,i)=>{const h=c[0]!==g?`<div class="pal-grp">${c[0]}</div>`:'';g=c[0];return h+`<div class="pal-item ${i===idx?'on':''}" data-i="${i}">${esc(c[1])}<span class="k">${c[3]}</span></div>`}).join('')||(q?`<div class="ai-note" style="margin:8px">Sonuç yok. Enter ile "${esc(inp.value)}" sorusunu Proje AI'ya sorun.</div>`:'')};
  const run=c=>{closeOv();if(!c){openAI(inp.value);return}const h=c[2];
    if(h.startsWith('#'))location.hash=h;else if(h.startsWith('file:')){S.cur.ecommerce=h.slice(5);ensureProj('ecommerce');if(!S.open.ecommerce.includes(h.slice(5)))S.open.ecommerce.push(h.slice(5));location.hash='#/p/ecommerce/code';render()}
    else if(h.startsWith('fb:')){location.hash='#/p/ecommerce/feedback';setTimeout(()=>ACT.fbOpen({dataset:{v:h.slice(3)}}),50)}
    else if(h==='fn:deployCRM'){location.hash='#/p/crm/deploy';setTimeout(()=>ACT.deployOpen({dataset:{p:'crm',env:'Staging'}}),50)}
    else if(h==='fn:review'){location.hash='#/p/ecommerce/reviews';setTimeout(()=>ACT.createReview({dataset:{p:'ecommerce'}}),50)}
    else if(h==='fn:askLogin')openAI('Login sistemi nasıl çalışıyor?');};
  inp.addEventListener('input',()=>{idx=0;draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){idx=Math.min(idx+1,res.length-1);draw();e.preventDefault()}if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);draw();e.preventDefault()}if(e.key==='Enter')run(res[idx])});
  $('#pallist').addEventListener('click',e=>{const it=e.target.closest('.pal-item');if(it)run(res[+it.dataset.i])});
  draw();inp.focus();
}

function runDeploy(pid){
  const p=P(pid);const env=$('#denv').value;const ver=$('#dver').value.slice(1);
  const deny=env==='Production'&&p.critical>0;let i=0;
  const draw=(fail)=>{$('#drb').innerHTML=`<div class="spread" style="margin-bottom:12px"><div><b>${env}</b> · <span class="mono">v${ver}</span></div><span class="small muted">Workflow wf_${rnd(4)} · canlı</span></div><div class="pipe">${DEPLOY_STEPS.map((s,k)=>{const st=k<i?'ok':k===i?(fail?'bad':'run'):'skip';return `<div class="pstep ${st}"><span class="ic">${st==='ok'?'✓':st==='bad'?'!':''}</span><span>${s}</span><span class="small muted">${st==='ok'?'tamam':st==='bad'?'reddedildi':st==='run'?'çalışıyor…':''}</span></div>`}).join('')}</div>
    ${fail?`<div class="badbox" style="margin-top:12px"><b>Ne oldu:</b> Policy deployment'ı reddetti.<br><b>Neden:</b> Projede ${p.critical} kritik güvenlik bulgusu var (SEC-184, SEC-185).<br><b>Ne yapabilirsiniz:</b> Bulguları düzeltin veya yöneticiden denetime yazılan bir istisna isteyin.</div><div class="row" style="margin-top:10px"><a class="btn" href="#/p/${pid}/security" data-a="close">Güvenlik bulgularına git</a><button class="btn" data-a="toast" data-m="İstisna talebi Zeynep Çelik'e gönderildi">İstisna iste</button></div>`:''}
    ${i>=DEPLOY_STEPS.length?`<div class="ai-note" style="margin-top:12px;border-left-color:var(--ok);background:var(--ok-soft)"><b style="color:var(--ok)">Deployment tamamlandı.</b> v${ver} ${env} ortamında; health check ve smoke test başarılı. Yedek: BKP-${8842+Math.floor(Math.random()*9)}.</div>`:''}`};
  $('#drf').innerHTML=`<button class="btn" data-a="close">Kapat</button>`;
  draw();
  window._depTimer=setInterval(()=>{
    if(deny&&i===1){clearInterval(window._depTimer);draw(true);addAudit('SYSTEM','Policy engine',`${env} deploy reddedildi (kritik bulgu)`,p.name);addTL(pid,'deploy',`${env} deployment policy tarafından reddedildi`,`${p.critical} kritik güvenlik bulgusu`,'bad');return}
    i++;draw();
    if(i>=DEPLOY_STEPS.length){clearInterval(window._depTimer);
      S.deploys[pid].unshift({id:'D-'+(890+S.deploys[pid].length),env,ver,by:U(ME_ID).name,at:'Bugün '+now(),st:'Tamamlandı',dur:'0 dk 9 sn',adapter:'Docker'});
      addTL(pid,'deploy',`v${ver} ${env.toLowerCase()} ortamına alındı`,`${U(ME_ID).name} · health check ve smoke test başarılı`,'ok');addAudit('USER',U(ME_ID).name,`${env} deploy başlattı (v${ver})`,p.name);
      const {parts}=route();if(parts[0]==='p')setTimeout(render,600);}
  },650);
}

  aiDocs:el=>{const pid=el.dataset.p;delete S.docStale[pid];addTL(pid,'docs','Dokümantasyon AI ile güncellendi','Geliştirici ve müşteri sürümleri','ok');toast('Dokümanlar son commit\'e göre güncellendi');render()},
  print:()=>window.print(),
  tlf:el=>{S.ui.tlf=el.dataset.v;render()},
  exportTL:el=>{const pid=el.dataset.p;const txt=S.timeline.filter(e=>e.p===pid).map(e=>`${e.day} ${e.t}\t${KIND[e.k][0]}\t${e.title}\t${e.desc}`).join('\n');modal('Zaman akışı raporu',`<pre class="mono small" style="white-space:pre-wrap;background:var(--code-bg);padding:12px;border-radius:8px;border:1px solid var(--line);max-height:50vh;overflow:auto">${esc(txt)}</pre>`)},
  danger:el=>{const p=P(el.dataset.p);const lbl={archive:'Projeyi arşivle',revoke:'Tüm müşteri linklerini kapat',rotate:'Tüm secret\'ları döndür'}[el.dataset.v];modal(lbl,`<p>Bu işlem denetim kaydına yazılır. Devam etmek için proje kısa adını yazın: <b class="mono">${p.id}</b></p><input class="in" id="dconf" autocomplete="off">`,`<button class="btn" data-a="close">Vazgeç</button><button class="btn danger" data-a="dangerGo" data-p="${p.id}" data-v="${el.dataset.v}">${lbl}</button>`)},
  dangerGo:el=>{if($('#dconf').value!==el.dataset.p){$('#dconf').classList.add('err');toast('Onay metni eşleşmedi');return}const p=P(el.dataset.p);if(el.dataset.v==='archive'){p.status='Arşivlendi';p.stage=12}if(el.dataset.v==='revoke')S.reviews.filter(r=>r.p===p.id).forEach(r=>{r.status='İptal edildi';r.expiresH=0});addAudit('USER',U(ME_ID).name,el.dataset.v+' işlemi',p.name);closeOv();toast('İşlem tamamlandı ve denetime yazıldı');render()},
  /* admin */
  userOpen:el=>{const u=U(el.dataset.v);drawer(esc(u.name),`<div class="row" style="margin-bottom:14px">${av(u.id,48)}<div><b style="font-size:16px">${esc(u.name)}</b><div class="small muted">${u.role} · ${u.status}</div></div></div><dl class="kv"><dt>E-posta</dt><dd>${u.email}</dd><dt>Ekipler</dt><dd>${u.teams.join(', ')}</dd><dt>MFA</dt><dd>${u.mfa?'Açık':'Kapalı'}</dd><dt>Son etkinlik</dt><dd>${u.last}</dd></dl><h3 style="margin-top:14px">Projeler</h3>${S.projects.filter(p=>p.members.includes(u.id)).map(p=>`<div class="spread" style="padding:5px 0"><span>${esc(p.name)}</span><span class="small muted">${u.role}</span></div>`).join('')}<h3 style="margin-top:14px">Yetkiler</h3><div class="row">${(ROLE_PERMS[u.role]||ROLE_PERMS['Developer']).map(k=>`<span class="tag">${k}</span>`).join('')}</div><h3 style="margin-top:14px">Son işlemler</h3>${S.audit.filter(a=>a[2]===u.name).map(a=>`<div class="small">${a[0]} · ${esc(a[3])}</div>`).join('')||'<p class="small muted">Kayıt yok</p>'}`,`<button class="btn danger" data-a="toast" data-m="Kullanıcı askıya alındı">Askıya al</button><button class="btn" data-a="toast" data-m="Tüm oturumlar sonlandırıldı">Oturumları sıfırla</button><button class="btn pri" data-a="toast" data-m="Rol değiştirme formu">Rolü değiştir</button>`)},
  permToggle:el=>{const r=el.dataset.r,k=el.dataset.k;const L=ROLE_PERMS[r];if(el.checked)L.push(k);else ROLE_PERMS[r]=L.filter(x=>x!==k);addAudit('USER',U(ME_ID).name,`${r} rolüne ${k} ${el.checked?'eklendi':'kaldırıldı'}`);toast('Yetki güncellendi ve denetime yazıldı')},
  aiLevel:el=>{S.aiLevel=el.dataset.v;addAudit('USER',U(ME_ID).name,`AI otonomi seviyesi ${el.dataset.v} yapıldı`);render()},
  auf:el=>{S.ui.auf=el.dataset.v;render()},
  /* portal */
  gateDemo:el=>{S.reviewer={...REVIEWERS[0]};persist();portalEnter(el.dataset.v)},
  gateSubmit:el=>{const g={first:$('#gf').value.trim(),last:$('#gl').value.trim(),dept:$('#gd').value==='Diğer'?($('#gdx').value.trim()||''):$('#gd').value,company:$('#gc').value.trim(),email:$('#ge').value.trim()};
    if(!g.first||!g.last||!g.dept){S.ui.gate={...g,err:true};render();return}S.reviewer=g;S.ui.gate=null;persist();portalEnter(el.dataset.v)},
  pIdentity:()=>{S.reviewer=null;S.ui.draft=null;persist();render()},
  pDev:el=>{S.ui.pv.dev=el.dataset.v;S.ui.draft=null;render()}, pTab:el=>{S.ui.pv.tab=el.dataset.v;render()},
  pMode:()=>{S.ui.pv.mode=!S.ui.pv.mode;render()}, pCancel:()=>{S.ui.draft=null;S.ui.pv.mode=false;render()},
  fType:el=>{S.ui.ftype=el.dataset.v;$$('#ftype button').forEach(b=>b.classList.toggle('on',b===el))},
  pSend:el=>{const r=S.reviews.find(x=>x.id===el.dataset.v);const d=DEVICES.find(x=>x.id===S.ui.pv.dev);const title=$('#ftitle').value.trim(),body=$('#fbody').value.trim();
    if(!title&&!body){$('#ftitle').classList.add('err');toast('Kısa bir başlık veya açıklama yazın');return}
    const ty=S.ui.ftype||'Değişiklik talebi';const n=Math.max(...S.feedback.map(f=>+f.id.slice(3)))+1;const ua=navigator.userAgent;const br=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Tarayıcı';
    const os=/Mac/.test(ua)?'macOS':/Windows/.test(ua)?'Windows':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':'Linux';
    const fb={id:'FB-'+n,p:r.p,title:title||body.slice(0,50),body:body||title,page:S.ui.draft.page,sel:S.ui.draft.sel,vw:d.w,vh:d.h,browser:`${br} / ${os} (simülasyon: ${d.n})`,version:r.version,build:'#1482',x:S.ui.draft.x,y:S.ui.draft.y,status:'Açık',priority:ty==='Hata'?'Yüksek':'Orta',cat:ty,assignee:null,reporter:{...S.reviewer},review:r.id,at:'Bugün '+now(),
      ai:{sum:`Müşteri ${S.ui.draft.page} sayfasındaki ${S.ui.draft.sel} öğesiyle ilgili ${ty.toLowerCase()} bildiriyor.`,cat:/button|btn/.test(S.ui.draft.sel)?'UI':ty==='Hata'?'Hata':'İçerik',sev:ty==='Hata'?'Yüksek':'Düşük',file:/btn|checkout|logo/.test(S.ui.draft.sel)?'src/styles/theme.css':'src/app/page.tsx'},comments:[]};
    S.feedback.unshift(fb);r.access++;addTL(r.p,'feedback',`${fb.id} geldi — ${fb.reporter.first} ${fb.reporter.last} (${fb.reporter.dept})`,fb.title,'warn');addAudit('CUSTOMER',`${fb.reporter.first} ${fb.reporter.last} · ${fb.reporter.dept}`,`${fb.id} feedback oluşturdu`,P(r.p).name);
    S.notifications.unshift({t:`${fb.id}: ${fb.title}`,d:`${fb.reporter.first} ${fb.reporter.last} · ${fb.reporter.dept}`,k:'feedback',href:`#/p/${r.p}/feedback`});
    S.ui.draft=null;S.ui.pv.mode=false;toast('Geri bildiriminiz ekibe iletildi. Teşekkürler!');render()},
  pChat:el=>{const v=$('#pchat').value.trim();if(!v)return;const c=S.chat[el.dataset.v]||(S.chat[el.dataset.v]=[]);c.push({from:'customer',who:S.reviewer.first+' '+S.reviewer.last,dept:S.reviewer.dept,t:v,at:now()});render();setTimeout(()=>{c.push({from:'team',who:U(ME_ID).name,t:'Mesajınızı aldık, birkaç dakika içinde dönüyorum.',at:now()});if(route().parts[0]==='review')render()},1200)},
  pApprove:el=>{const f=S.feedback.find(x=>x.id===el.dataset.v);f.status='Çözüldü';f.comments.push({a:'customer',t:'Onaylıyorum, teşekkürler.'});addTL(f.p,'feedback',`${f.id} müşteri tarafından onaylandı`,`${f.reporter.first} ${f.reporter.last} (${f.reporter.dept})`,'ok');toast('Onayınız iletildi');render()},
  pReject:el=>{const f=S.feedback.find(x=>x.id===el.dataset.v);f.status='Açık';f.comments.push({a:'customer',t:'Hâlâ düzeltilmesi gerekiyor.'});addTL(f.p,'feedback',`${f.id} müşteri tarafından yeniden açıldı`,`${f.reporter.first} ${f.reporter.last}`,'warn');toast('Notunuz ekibe iletildi');render()}
});
function portalEnter(tok){const r=S.reviews.find(x=>x.token===tok);r.visitors++;r.access++;addAudit('CUSTOMER',`${S.reviewer.first} ${S.reviewer.last} · ${S.reviewer.dept}`,`${r.id} inceleme linkine giriş yaptı`,P(r.p).name);S.ui.page='/';render()}

/* input/change handlers */
Object.assign(ON,{
  role:el=>{S.role=el.value;persist();render();toast(`${S.role} görünümüne geçildi`)},
  pq:el=>{S.ui.pq=el.value;clearTimeout(window._pq);window._pq=setTimeout(()=>{render();const i=$('[data-on="pq"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)},
  fbSet:el=>{const f=S.feedback.find(x=>x.id===el.dataset.id);const k=el.dataset.k;f[k]=el.value||null;if(k==='status')addTL(f.p,'feedback',`${f.id} durumu: ${el.value}`,`${U(ME_ID).name} güncelledi`,'idle');render();toast('Güncellendi')},
  pDevSel:el=>{S.ui.pv.dev=el.value;S.ui.draft=null;render()}
});

/* =========================================================
   GLOBAL EVENTS + INIT
   ========================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.id==='fbov')return;
  const fn=ACT[el.dataset.a];if(fn){if(el.tagName==='A'&&!el.getAttribute('href')?.startsWith('#'))e.preventDefault();fn(el,e)}
  if(window.innerWidth<=860&&el.closest('.side')&&el.dataset.a!=='menu')$('#side')?.classList.remove('open');
});
document.addEventListener('click',e=>{if(window.innerWidth<=860&&e.target.closest('.side a'))$('#side')?.classList.remove('open')});
document.addEventListener('change',e=>{const el=e.target.closest('[data-on]');if(el&&ON[el.dataset.on]&&el.tagName==='SELECT')ON[el.dataset.on](el);if(e.target.id==='gd'){const o=$('#gdo');if(o)o.style.display=e.target.value==='Diğer'?'':'none'}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-on]');if(el&&el.tagName==='INPUT'&&ON[el.dataset.on])ON[el.dataset.on](el)});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  if(e.key==='Escape')closeOv();
  if(e.key==='Enter'&&e.target.id==='aiin')ACT.aiSend({dataset:{p:curPid()}});
  if(e.key==='Enter'&&e.target.id==='pchat'){const r=S.reviews.find(x=>x.token===route().parts[1]);if(r)ACT.pChat({dataset:{v:r.id}})}
  if(e.key==='Enter'&&e.target.id==='tchat'){$('[data-a="teamChat"]')?.click()}
});
/* feedback overlay click → ask iframe which element */
document.addEventListener('click',e=>{
  const ov=e.target.closest('#fbov');if(!ov||ov.classList.contains('off'))return;
  const r=ov.getBoundingClientRect();const sc=+ov.dataset.sc;const x=Math.round((e.clientX-r.left)/sc),y=Math.round((e.clientY-r.top)/sc);
  S.ui._pick={x,y};const fr=$('#portalframe');if(fr&&fr.contentWindow)fr.contentWindow.postMessage({ph:'pick',x,y},'*');
  setTimeout(()=>{if(S.ui._pick){S.ui.draft={page:S.ui.page||'/',sel:'body',x,y};S.ui._pick=null;S.ui.pv.mode=false;render()}},400);
});
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.ph==='nav'){S.ui.page=d.page;S.ui.draft=null;render()}
  if(d.ph==='picked'&&S.ui._pick){S.ui._pick=null;S.ui.draft={page:S.ui.page||'/',sel:d.sel,x:d.x,y:d.y};if(S.ui.pv)S.ui.pv.mode=false;render()}
});
window.addEventListener('hashchange',()=>{closeOv();render();const m=$('#main');if(m)m.scrollTop=0});

S.buf={};
restore();applyTheme();loadFiles();
const _origRender=render;
render=function(){_origRender();const {parts}=route();if(parts[0]==='p'&&(parts[2]==='code')){setupEditor(parts[1])}};
render();
</script>
</body></html>
